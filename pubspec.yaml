
name: camera_localiza
description: "Aplicativo Flutter de perfil, câmera e localização."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Acesso à câmera e galeria
  image_picker: ^1.1.2

  # Acesso à localização GPS
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
